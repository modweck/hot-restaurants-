name: Weekly New Restaurant Discovery

on:
  schedule:
    - cron: '0 15 * * 2'   # Tuesday 11am EDT (UTC-4)
    - cron: '0 15 * * 4'   # Thursday 11am EDT (UTC-4)
  workflow_dispatch:
    inputs:
      source:
        description: 'Which scraper to run'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - press
          - resy

permissions:
  contents: write

jobs:
  discover-press:
    if: github.event_name == 'workflow_dispatch' && (inputs.source == 'press' || inputs.source == 'both') || github.event.schedule == '0 15 * * 2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Eater/press discovery
        run: node scripts/discover-from-press.js --add --force
        timeout-minutes: 30

      - name: Commit and push
        run: |
          git config user.name "SeatWize Bot"
          git config user.email "bot@seatwize.com"
          git add netlify/functions/BOOKING_MASTER.json data/press_discoveries.json data/press_last_run.json
          git diff --staged --quiet || git commit -m "🔍 new restaurant discovery — press $(date +'%Y-%m-%d')"
          git push

  discover-resy:
    if: github.event_name == 'workflow_dispatch' && (inputs.source == 'resy' || inputs.source == 'both') || github.event.schedule == '0 15 * * 4'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Resy new venue discovery
        run: node scripts/discover-new-on-resy.js --add
        timeout-minutes: 45

      - name: Commit and push
        run: |
          git config user.name "SeatWize Bot"
          git config user.email "bot@seatwize.com"
          git add netlify/functions/BOOKING_MASTER.json netlify/functions/booking_lookup.json data/resy_new_discoveries.json
          git diff --staged --quiet || git commit -m "🔍 new restaurant discovery — resy $(date +'%Y-%m-%d')"
          git push
