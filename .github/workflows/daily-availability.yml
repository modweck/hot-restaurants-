name: Daily Availability Check

on:
  schedule:
    - cron: '30 15 * * *'  # 10:30am EST (UTC-5) = 3:30pm UTC
  workflow_dispatch:        # also allows manual trigger from GitHub UI

jobs:
  scrape-availability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd netlify/functions
          npm install node-fetch 2>/dev/null || true

      - name: Write Resy token into scraper
        run: |
          cd netlify/functions
          sed -i "s|X-Resy-Auth-Token': '.*'|X-Resy-Auth-Token': '${{ secrets.RESY_TOKEN }}'|g" resy-tonight-check.js
          sed -i "s|X-Resy-Universal-Auth': '.*'|X-Resy-Universal-Auth': '${{ secrets.RESY_TOKEN }}'|g" resy-tonight-check.js

      - name: Run availability scraper
        run: |
          cd netlify/functions
          node resy-tonight-check.js --all
        timeout-minutes: 90

      - name: Slim down availability file
        run: |
          cd netlify/functions
          node slim-availability.js
          cp tonight_availability_slim.json tonight_availability.json

      - name: Commit and push fresh availability
        run: |
          git config user.name "SeatWize Bot"
          git config user.email "bot@seatwize.com"
          git add netlify/functions/tonight_availability.json
          git diff --staged --quiet || git commit -m "🍽️ availability update $(date +'%Y-%m-%d')"
          git push

      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ SeatWize availability check failed — $(date +'%Y-%m-%d')"
          to: maurice@dwecks.net
          from: SeatWize Bot <bot@seatwize.com>
          body: |
            The nightly Resy availability check failed.
            
            Existing availability data from the previous run has been kept — nothing was overwritten.
            
            Check the GitHub Actions log for details:
            https://github.com/modweck/hot-restaurants-/actions
