<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>SeatWize — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'DM Sans',-apple-system,sans-serif;background:#f5f0eb;color:#1a1a2e;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center}
    @media(max-height:700px){body{align-items:flex-start;padding-top:20px}}

    .shell{max-width:420px;width:100%;margin:0 auto;padding:40px 28px 50px;position:relative}
    @media(min-width:520px){.shell{padding:50px 36px 60px}}

    /* ── warm glow behind logo ── */
    .glow{position:fixed;top:-120px;right:-80px;width:400px;height:400px;background:radial-gradient(circle,rgba(255,69,0,.07) 0%,transparent 70%);pointer-events:none;z-index:0}
    .glow2{position:fixed;bottom:-100px;left:-60px;width:350px;height:350px;background:radial-gradient(circle,rgba(255,140,0,.05) 0%,transparent 70%);pointer-events:none;z-index:0}

    /* ── logo ── */
    .logo{font-family:'Playfair Display',serif;font-size:42px;font-weight:900;color:#1a1a2e;letter-spacing:-1px;text-align:center;margin-bottom:6px;position:relative;z-index:1}
    .logo span{color:#ff4500}
    .tagline{text-align:center;font-size:14px;font-weight:500;color:#888;margin-bottom:36px;letter-spacing:.3px;position:relative;z-index:1}

    /* ── divider ── */
    .divider{display:flex;align-items:center;gap:14px;margin:22px 0}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(0,0,0,.1)}
    .divider span{font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:1px}

    /* ── form ── */
    .form-group{margin-bottom:14px;position:relative;z-index:1}
    .form-label{display:block;font-size:11px;font-weight:700;color:#777;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
    .form-input{width:100%;padding:14px 16px;background:#fff;border:1.5px solid rgba(0,0,0,.1);border-radius:12px;font-size:15px;font-family:'DM Sans',sans-serif;color:#1a1a2e;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none}
    .form-input::placeholder{color:#bbb}
    .form-input:focus{border-color:rgba(255,69,0,.5);box-shadow:0 0 0 3px rgba(255,69,0,.08)}

    /* ── buttons ── */
    .btn-primary{width:100%;padding:15px 20px;background:#ff4500;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:.3px;transition:all .15s;position:relative;z-index:1;margin-top:6px}
    .btn-primary:hover{background:#e83e00}
    .btn-primary:active{transform:scale(.98);background:#d63600}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}

    .btn-google{width:100%;padding:14px 20px;background:#fff;color:#1a1a2e;border:1.5px solid rgba(0,0,0,.12);border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .15s;position:relative;z-index:1}
    .btn-google:hover{border-color:rgba(0,0,0,.25);box-shadow:0 2px 12px rgba(0,0,0,.06)}
    .btn-google:active{transform:scale(.98)}
    .btn-google svg{width:18px;height:18px;flex-shrink:0}

    /* ── toggle ── */
    .toggle{text-align:center;margin-top:24px;font-size:13px;color:#888;position:relative;z-index:1}
    .toggle a{color:#ff4500;font-weight:700;cursor:pointer;text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s}
    .toggle a:hover{border-bottom-color:#ff4500}

    /* ── error ── */
    .error-msg{background:#fef2f2;color:#dc2626;border:1px solid rgba(220,38,38,.15);border-radius:10px;padding:10px 14px;font-size:12px;font-weight:600;margin-bottom:14px;display:none;position:relative;z-index:1}
    .error-msg.show{display:block;animation:shake .4s ease}
    .success-msg{background:#f0fdf4;color:#15803d;border:1px solid rgba(21,128,61,.15);border-radius:10px;padding:10px 14px;font-size:12px;font-weight:600;margin-bottom:14px;display:none;position:relative;z-index:1}
    .success-msg.show{display:block}

    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

    /* ── loading spinner ── */
    .spinner{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── subtle entry animation ── */
    .shell{animation:fadeUp .5s ease both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

    /* ── footer accent ── */
    .footer-note{text-align:center;margin-top:32px;font-size:11px;color:#bbb;letter-spacing:.3px;position:relative;z-index:1}
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow2"></div>

  <div class="shell">
    <div class="logo">Seat<span>Wize</span></div>
    <div class="tagline">NYC's smartest restaurant guide</div>

    <div id="errorMsg" class="error-msg"></div>
    <div id="successMsg" class="success-msg"></div>

    <!-- Google OAuth -->
    <button class="btn-google" onclick="googleSignIn()">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>

    <div class="divider"><span>or</span></div>

    <!-- Email form -->
    <form id="authForm" onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" id="email" type="email" placeholder="you@email.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" id="password" type="password" placeholder="••••••••" required autocomplete="current-password" minlength="6" />
      </div>
      <button class="btn-primary" type="submit" id="submitBtn">
        <span id="btnText">Sign In</span>
      </button>
    </form>

    <div class="toggle">
      <span id="toggleText">Don't have an account?</span>
      <a onclick="toggleMode()" id="toggleLink">Sign Up</a>
    </div>

    <div class="footer-note">🍽 Find your next favorite spot</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://zdsolubfxzvrqiqvwjev.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpkc29sdWJmeHp2cnFpcXZ3amV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMzMwODksImV4cCI6MjA5MDcwOTA4OX0.XOuZOh4yaYGf1bUJpIDl48F0MV-kjct-_nWtgs6MJPM';
    const _supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isSignUp = false;

    // If already logged in, redirect
    (async () => {
      const { data: { session } } = await _supa.auth.getSession();
      if (session) window.location.href = 'index.html';
    })();

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.add('show');
      document.getElementById('successMsg').classList.remove('show');
      setTimeout(() => el.classList.remove('show'), 5000);
    }

    function showSuccess(msg) {
      const el = document.getElementById('successMsg');
      el.textContent = msg;
      el.classList.add('show');
      document.getElementById('errorMsg').classList.remove('show');
    }

    function toggleMode() {
      isSignUp = !isSignUp;
      document.getElementById('btnText').textContent = isSignUp ? 'Create Account' : 'Sign In';
      document.getElementById('toggleText').textContent = isSignUp ? 'Already have an account?' : "Don't have an account?";
      document.getElementById('toggleLink').textContent = isSignUp ? 'Sign In' : 'Sign Up';
      document.getElementById('password').setAttribute('autocomplete', isSignUp ? 'new-password' : 'current-password');
      document.getElementById('errorMsg').classList.remove('show');
      document.getElementById('successMsg').classList.remove('show');
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');

      btn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span>';

      try {
        if (isSignUp) {
          const { data, error } = await _supa.auth.signUp({ email, password });
          if (error) throw error;
          if (data.user && !data.session) {
            showSuccess('Check your email to confirm your account, then sign in.');
            isSignUp = false;
            document.getElementById('btnText').textContent = 'Sign In';
            document.getElementById('toggleText').textContent = "Don't have an account?";
            document.getElementById('toggleLink').textContent = 'Sign Up';
          } else {
            window.location.href = 'index.html';
          }
        } else {
          const { data, error } = await _supa.auth.signInWithPassword({ email, password });
          if (error) throw error;
          window.location.href = 'index.html';
        }
      } catch (err) {
        showError(err.message || 'Something went wrong');
      } finally {
        btn.disabled = false;
        btnText.textContent = isSignUp ? 'Create Account' : 'Sign In';
      }
    }

    async function googleSignIn() {
      const { error } = await _supa.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + '/index.html' }
      });
      if (error) showError(error.message);
    }
  </script>
</body>
</html>
